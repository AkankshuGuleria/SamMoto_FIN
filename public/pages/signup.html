<!DOCTYPE html>
<!-- Frontend redesign: refreshed the signup page with the shared premium UI shell while preserving all auth IDs, callbacks, and inline logic. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SamMoto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="page-transition" id="page-transition"></div>

    <div id="preloader">
        <div class="preloader-inner">
            <div class="preloader-gauge">
                <svg viewBox="0 0 240 240" aria-hidden="true">
                    <defs>
                        <linearGradient id="samMotoRevGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7a0f18"></stop>
                            <stop offset="55%" stop-color="#e63946"></stop>
                            <stop offset="100%" stop-color="#ff7b85"></stop>
                        </linearGradient>
                    </defs>
                    <circle class="preloader-track" cx="120" cy="120" r="82"></circle>
                    <circle class="preloader-arc" cx="120" cy="120" r="82"></circle>
                </svg>
                <div class="preloader-rpm">
                    <strong>9.5K</strong>
                    <span>Rev Limit</span>
                </div>
            </div>
            <div class="preloader-word" aria-label="SAMMOTO">
                <span>S</span>
                <span>A</span>
                <span>M</span>
                <span class="accent">M</span>
                <span class="accent">O</span>
                <span class="accent">T</span>
                <span class="accent">O</span>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <a href="/index.html" class="nav-logo">SAM<span>MOTO</span></a>
        <div></div>
        <div class="nav-right">
            <a href="/login.html" class="btn-nav outline">Login</a>
        </div>
    </nav>

    <div class="form-page">
        <div class="form-box" style="max-width:560px;">
            <h2>Create Account</h2>
            <p class="sub">Join SamMoto to manage service history, shop parts, and move through every booking with confidence.</p>

            <div class="alert alert-danger" id="error-msg"></div>
            <div class="alert alert-success" id="success-msg"></div>

            <div class="form-row">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Your name" autocomplete="name">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 98765 43210">
                </div>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Minimum 6 characters">
                    <button class="eye-btn" id="toggle-eye" tabindex="-1"><i class="fas fa-eye" id="eye-icon"></i></button>
                </div>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm" placeholder="Re-enter password">
            </div>

            <div style="margin-bottom:1.5rem;">
                <label style="display:flex;align-items:flex-start;gap:10px;font-size:0.84rem;color:rgba(240,240,240,0.68);cursor:pointer;">
                    <input type="checkbox" id="terms" style="accent-color:var(--accent);margin-top:3px;">
                    I agree to the <a href="#" class="text-accent" style="margin:0 4px;">Terms of Service</a> and <a href="#" class="text-accent">Privacy Policy</a>
                </label>
            </div>

            <button class="btn btn-primary btn-block" id="signup-btn" onclick="doSignup()">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <div style="text-align:center;margin:18px 0;color:rgba(240,240,240,0.56);font-size:0.82rem;letter-spacing:0.18em;text-transform:uppercase;">
                Or continue with
            </div>

            <div id="g_id_onload"
                data-client_id="900727918656-1iui953ls2519qedlpkpvb6iu16lqiph.apps.googleusercontent.com"
                data-context="signup" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false"
                data-use_fedcm_for_prompt="true">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signup_with" data-size="large" data-logo_alignment="left"
                style="display:flex;justify-content:center;margin-bottom:20px;">
            </div>

            <div class="form-footer">
                Already have an account? <a href="/login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/animations.js" defer></script>
    <script>
        const _a = Auth.getAuth();
        if (_a.loggedIn) window.location.replace(_a.role === 'admin' ? '/admindashboard.html' : '/cust_dashboard.html');

        document.getElementById('toggle-eye').addEventListener('click', () => {
            const pw = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            pw.type = pw.type === 'password' ? 'text' : 'password';
            icon.className = pw.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        async function doSignup() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const terms = document.getElementById('terms').checked;
            const errEl = document.getElementById('error-msg');
            const okEl = document.getElementById('success-msg');
            const btn = document.getElementById('signup-btn');

            errEl.classList.remove('show'); okEl.classList.remove('show');

            if (!name || !email || !password) { errEl.textContent = 'Name, email, and password are required.'; errEl.classList.add('show'); return; }
            if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.add('show'); return; }
            if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.classList.add('show'); return; }
            if (!terms) { errEl.textContent = 'Please accept the terms to continue.'; errEl.classList.add('show'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    errEl.textContent = data.message || 'Registration failed.';
                    errEl.classList.add('show'); return;
                }

                Auth.setAuth(data);
                okEl.textContent = 'Account created! Redirecting...';
                okEl.classList.add('show');
                setTimeout(() => window.location.replace('/cust_dashboard.html'), 1200);
            } catch (err) {
                errEl.textContent = 'Network error. Is the server running?';
                errEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        }

        async function handleGoogleLogin(response) {
            const errEl = document.getElementById('error-msg');
            errEl.classList.remove('show');
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    errEl.textContent = data.message || 'Google authentication failed.';
                    errEl.classList.add('show');
                    return;
                }
                Auth.setAuth(data);
                window.location.replace(data.role === 'admin' ? '/admindashboard.html' : '/cust_dashboard.html');
            } catch (err) {
                errEl.textContent = 'Network error during Google login.';
                errEl.classList.add('show');
            }
        }
    </script>
</body>

</html>
