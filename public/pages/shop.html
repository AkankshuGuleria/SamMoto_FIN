<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — SamMoto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar">
    <a href="/index.html" class="nav-logo">SAM<span>MOTO</span></a>
    <ul class="nav-links" id="nav-links"></ul>
    <div class="nav-right" id="nav-right"></div>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>
<div class="mobile-menu" id="mobile-menu"><div id="mobile-links"></div></div>

<!-- Modal -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal" style="max-width:400px;text-align:center">
        <div style="font-size:2.5rem;color:var(--success);margin-bottom:1rem"><i class="fas fa-check-circle"></i></div>
        <h3 id="modal-title" style="margin-bottom:0.5rem">Added to Cart</h3>
        <p id="modal-desc" style="color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem"></p>
        <div style="display:flex;gap:0.75rem">
            <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Continue Shopping</button>
            <a href="/cart.html" class="btn btn-primary" style="flex:1;justify-content:center">View Cart</a>
        </div>
    </div>
</div>

<div style="padding-top:64px">
    <div style="padding:3rem 5% 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border)">
        <h1 style="font-size:2rem;font-weight:800">Spare Parts & <span class="text-accent">Accessories</span></h1>
        <p style="color:var(--muted);margin-top:0.5rem">Genuine parts for all major Indian bike brands</p>
    </div>

    <div style="padding:2rem 5%">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem">
            <div class="filter-bar" style="margin:0">
                <button class="filter-btn active" data-cat="all">All</button>
                <button class="filter-btn" data-cat="part">Parts</button>
                <button class="filter-btn" data-cat="accessory">Accessories</button>
                <button class="filter-btn" data-cat="oil">Oils & Fluids</button>
                <button class="filter-btn" data-cat="service">Services</button>
            </div>
            <div style="position:relative">
                <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.85rem"></i>
                <input type="text" id="search-input" placeholder="Search products..." style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:9px 12px 9px 36px;border-radius:var(--radius);font-size:0.88rem;outline:none;width:220px">
            </div>
        </div>

        <div id="product-grid" class="grid-4">
            <div class="loading-center" style="grid-column:1/-1"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
<script>
let allProducts = [];
let activeFilter = 'all';

document.addEventListener('DOMContentLoaded', async () => {
    await loadProducts();

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.cat;
            renderProducts();
        });
    });

    document.getElementById('search-input').addEventListener('input', renderProducts);
});

async function loadProducts() {
    try {
        const res = await fetch('/api/products');
        const data = await res.json();
        allProducts = Array.isArray(data) ? data : [];
        renderProducts();
    } catch (err) {
        document.getElementById('product-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-exclamation-circle"></i><h3>Failed to load products</h3><p>Make sure the server is running.</p></div>`;
    }
}

function renderProducts() {
    const query = document.getElementById('search-input').value.toLowerCase();
    let list = allProducts;
    if (activeFilter !== 'all') list = list.filter(p => p.category === activeFilter);
    if (query) list = list.filter(p => p.title.toLowerCase().includes(query) || (p.description || '').toLowerCase().includes(query));

    const grid = document.getElementById('product-grid');
    if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-box-open"></i><h3>No products found</h3><p>Try a different filter or search term.</p></div>`;
        return;
    }

    grid.innerHTML = list.map(p => `
        <div class="product-card">
            <div class="product-img"><i class="fas ${p.icon || 'fa-box'}"></i></div>
            <div class="product-body">
                <div class="product-cat">${p.category}</div>
                <div class="product-title">${p.title}</div>
                <div class="product-desc">${(p.description || 'Quality motorcycle part.').substring(0, 70)}</div>
                <div class="product-footer">
                    <div class="product-price">₹${p.price.toFixed(2)}</div>
                    <button class="btn btn-primary btn-sm" onclick="addToCart('${p._id}','${p.title.replace(/'/g,"\\'")}',${p.price},'${p.category}','${p.icon||'fa-box'}')">
                        <i class="fas fa-cart-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>`).join('');
}

function addToCart(id, name, price, category, icon) {
    let cart = JSON.parse(localStorage.getItem('sm_cart') || '[]');
    const existing = cart.find(i => i.id === id);
    if (existing) {
        existing.qty = (existing.qty || 1) + 1;
    } else {
        cart.push({ id, name, price, category, icon, qty: 1, type: ['part','accessory','oil'].includes(category) ? 'part' : 'service' });
    }
    localStorage.setItem('sm_cart', JSON.stringify(cart));
    updateCartBadge();

    document.getElementById('modal-title').textContent = 'Added to Cart!';
    document.getElementById('modal-desc').textContent = `${name} has been added to your job card.`;
    document.getElementById('cart-modal').classList.add('open');
}

function closeModal() { document.getElementById('cart-modal').classList.remove('open'); }
document.getElementById('cart-modal').addEventListener('click', e => { if (e.target === document.getElementById('cart-modal')) closeModal(); });
</script>
</body>
</html>
