<!DOCTYPE html>
<!-- Frontend redesign: restyled the shop with the shared immersive shell and upgraded product-card visuals while keeping the existing product fetch and cart logic intact. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - SamMoto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="page-transition" id="page-transition"></div>

    <div id="preloader">
        <div class="preloader-inner">
            <div class="preloader-gauge">
                <svg viewBox="0 0 240 240" aria-hidden="true">
                    <defs>
                        <linearGradient id="samMotoRevGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7a0f18"></stop>
                            <stop offset="55%" stop-color="#e63946"></stop>
                            <stop offset="100%" stop-color="#ff7b85"></stop>
                        </linearGradient>
                    </defs>
                    <circle class="preloader-track" cx="120" cy="120" r="82"></circle>
                    <circle class="preloader-arc" cx="120" cy="120" r="82"></circle>
                </svg>
                <div class="preloader-rpm">
                    <strong>9.5K</strong>
                    <span>Rev Limit</span>
                </div>
            </div>
            <div class="preloader-word" aria-label="SAMMOTO">
                <span>S</span>
                <span>A</span>
                <span>M</span>
                <span class="accent">M</span>
                <span class="accent">O</span>
                <span class="accent">T</span>
                <span class="accent">O</span>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <a href="/index.html" class="nav-logo">SAM<span>MOTO</span></a>
        <ul class="nav-links" id="nav-links"></ul>
        <div class="nav-right" id="nav-right"></div>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>
    <div class="mobile-menu" id="mobile-menu"><div id="mobile-links"></div></div>

    <div style="padding-top:calc(var(--nav-height) + 38px);">
        <section style="padding-top:56px;padding-bottom:42px;">
            <div class="section-header" style="text-align:left;max-width:100%;margin-bottom:0;">
                <span class="eyebrow">Inventory grid</span>
                <h2>Spare parts and <span>garage essentials</span></h2>
                <p>Genuine parts, workshop consumables, accessories, and service add-ons for major Indian motorcycle platforms.</p>
            </div>
        </section>

        <section style="padding-top:0;">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.75rem;">
                <div class="filter-bar" style="margin:0;">
                    <button class="filter-btn active" data-cat="all">All</button>
                    <button class="filter-btn" data-cat="part">Parts</button>
                    <button class="filter-btn" data-cat="accessory">Accessories</button>
                    <button class="filter-btn" data-cat="oil">Oils and Fluids</button>
                    <button class="filter-btn" data-cat="service">Services</button>
                </div>
                <div style="position:relative;min-width:240px;">
                    <i class="fas fa-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:0.85rem;"></i>
                    <input type="text" id="search-input" placeholder="Search products..." style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--text);padding:14px 16px 14px 40px;border-radius:16px;font-size:0.9rem;outline:none;width:100%;">
                </div>
            </div>

            <div id="product-grid" class="grid-4">
                <div class="loading-center" style="grid-column:1/-1;"><div class="spinner"></div></div>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="cart-modal">
        <div class="modal" style="max-width:420px;text-align:center;">
            <div style="font-size:2.5rem;color:var(--success);margin-bottom:1rem;"><i class="fas fa-check-circle"></i></div>
            <h3 id="modal-title" style="margin-bottom:0.5rem;">Added to Cart</h3>
            <p id="modal-desc" style="color:rgba(240,240,240,0.68);font-size:0.9rem;margin-bottom:1.5rem;"></p>
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Continue Shopping</button>
                <a href="/cart.html" class="btn btn-primary" style="flex:1;">View Cart</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/animations.js" defer></script>
    <script>
        let allProducts = [];
        let activeFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadProducts();

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.dataset.cat;
                    renderProducts();
                });
            });

            document.getElementById('search-input').addEventListener('input', renderProducts);
        });

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                allProducts = Array.isArray(data) ? data : [];
                renderProducts();
            } catch (err) {
                document.getElementById('product-grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-circle"></i><h3>Failed to load products</h3><p>Make sure the server is running.</p></div>';
            }
        }

        function renderProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            let list = allProducts;
            if (activeFilter !== 'all') list = list.filter(p => p.category === activeFilter);
            if (query) list = list.filter(p => p.title.toLowerCase().includes(query) || (p.description || '').toLowerCase().includes(query));

            const grid = document.getElementById('product-grid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-box-open"></i><h3>No products found</h3><p>Try a different filter or search term.</p></div>';
                return;
            }

            grid.innerHTML = list.map(p => {
                const stockClass = p.stock < 3 ? 'is-low' : p.stock < 10 ? 'is-medium' : 'is-high';
                const stockLabel = p.stock < 3 ? 'Low stock' : p.stock < 10 ? 'Limited stock' : 'In stock';
                return `
        <div class="product-card">
            <div class="product-img"><i class="fas ${p.icon || 'fa-box'}"></i></div>
            <div class="product-body">
                <div class="product-cat">${p.category}</div>
                <div class="product-title">${p.title}</div>
                <div class="product-desc">${(p.description || 'Quality motorcycle part.').substring(0, 70)}</div>
                <div class="stock-indicator ${stockClass}">${stockLabel}</div>
                <div class="product-footer">
                    <div class="product-price">&#8377;${p.price.toFixed(2)}</div>
                    <button class="btn btn-primary btn-sm" onclick="addToCart('${p._id}','${p.title.replace(/'/g, "\\'")}',${p.price},'${p.category}','${p.icon || 'fa-box'}')">
                        <i class="fas fa-cart-plus"></i> Add
                    </button>
                </div>
            </div>
        </div>`;
            }).join('');
        }

        function addToCart(id, name, price, category, icon) {
            let cart = JSON.parse(localStorage.getItem('sm_cart') || '[]');
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty = (existing.qty || 1) + 1;
            } else {
                cart.push({ id, name, price, category, icon, qty: 1, type: ['part', 'accessory', 'oil'].includes(category) ? 'part' : 'service' });
            }
            localStorage.setItem('sm_cart', JSON.stringify(cart));
            updateCartBadge();

            document.getElementById('modal-title').textContent = 'Added to Cart!';
            document.getElementById('modal-desc').textContent = `${name} has been added to your job card.`;
            document.getElementById('cart-modal').classList.add('open');
        }

        function closeModal() { document.getElementById('cart-modal').classList.remove('open'); }
        document.getElementById('cart-modal').addEventListener('click', e => { if (e.target === document.getElementById('cart-modal')) closeModal(); });
    </script>
</body>

</html>
