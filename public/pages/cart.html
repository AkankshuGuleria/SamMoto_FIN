<!DOCTYPE html>
<!-- Frontend redesign: upgraded the cart page with the shared immersive shell while preserving the existing cart storage, quantity controls, and booking path. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SamMoto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="page-transition" id="page-transition"></div>

    <div id="preloader">
        <div class="preloader-inner">
            <div class="preloader-gauge">
                <svg viewBox="0 0 240 240" aria-hidden="true">
                    <defs>
                        <linearGradient id="samMotoRevGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7a0f18"></stop>
                            <stop offset="55%" stop-color="#e63946"></stop>
                            <stop offset="100%" stop-color="#ff7b85"></stop>
                        </linearGradient>
                    </defs>
                    <circle class="preloader-track" cx="120" cy="120" r="82"></circle>
                    <circle class="preloader-arc" cx="120" cy="120" r="82"></circle>
                </svg>
                <div class="preloader-rpm">
                    <strong>9.5K</strong>
                    <span>Rev Limit</span>
                </div>
            </div>
            <div class="preloader-word" aria-label="SAMMOTO">
                <span>S</span>
                <span>A</span>
                <span>M</span>
                <span class="accent">M</span>
                <span class="accent">O</span>
                <span class="accent">T</span>
                <span class="accent">O</span>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <a href="/index.html" class="nav-logo">SAM<span>MOTO</span></a>
        <ul class="nav-links" id="nav-links"></ul>
        <div class="nav-right" id="nav-right"></div>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>
    <div class="mobile-menu" id="mobile-menu"><div id="mobile-links"></div></div>

    <section style="padding-top:calc(var(--nav-height) + 60px);">
        <div class="section-header" style="text-align:left;max-width:100%;margin-bottom:2rem;">
            <span class="eyebrow">Job card</span>
            <h2>Your active <span>garage cart</span></h2>
            <p>Review parts and service items before locking in your booking.</p>
        </div>

        <div id="cart-content"></div>
    </section>

    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/animations.js" defer></script>
    <script>
        function getCart() { return JSON.parse(localStorage.getItem('sm_cart') || '[]'); }
        function saveCart(cart) { localStorage.setItem('sm_cart', JSON.stringify(cart)); updateCartBadge(); }

        function render() {
            const cart = getCart();
            const container = document.getElementById('cart-content');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="margin-top:3rem;">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Your cart is empty</h3>
                        <p>Add some parts or services from the shop.</p>
                        <a href="/shop.html" class="btn btn-primary mt-3">Go to Shop</a>
                    </div>`;
                return;
            }

            let partsCost = 0, laborCost = 0;
            cart.forEach(i => {
                const p = parseFloat(i.price) * (i.qty || 1);
                if (i.type === 'part') partsCost += p; else laborCost += p;
            });
            const total = partsCost + laborCost;

            container.innerHTML = `
                <div class="cart-layout">
                    <div id="cart-items">
                        ${cart.map(item => `
                            <div class="cart-item">
                                <div class="cart-item-icon"><i class="fas ${item.icon || 'fa-box'}"></i></div>
                                <div class="cart-item-info">
                                    <div class="name">${item.name}</div>
                                    <div class="meta">${item.category} · &#8377;${parseFloat(item.price).toFixed(2)} each</div>
                                </div>
                                <div class="qty-ctrl">
                                    <button class="qty-btn" onclick="changeQty('${item.id}',-1)"><i class="fas fa-minus" style="font-size:0.65rem;"></i></button>
                                    <span class="qty-num">${item.qty || 1}</span>
                                    <button class="qty-btn" onclick="changeQty('${item.id}',1)"><i class="fas fa-plus" style="font-size:0.65rem;"></i></button>
                                </div>
                                <div style="font-weight:700;min-width:90px;text-align:right;">&#8377;${(parseFloat(item.price) * (item.qty || 1)).toFixed(2)}</div>
                                <button onclick="removeItem('${item.id}')" style="background:none;border:none;color:var(--muted-2);font-size:1rem;padding:4px;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>`).join('')}
                        <button onclick="clearCart()" class="btn btn-secondary btn-sm mt-2">
                            <i class="fas fa-trash"></i> Clear Cart
                        </button>
                    </div>
                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-row"><span class="label">Parts and Accessories</span><span>&#8377;${partsCost.toFixed(2)}</span></div>
                        <div class="summary-row"><span class="label">Labour and Services</span><span>&#8377;${laborCost.toFixed(2)}</span></div>
                        <div class="summary-row total"><span>Total</span><span class="text-accent">&#8377;${total.toFixed(2)}</span></div>
                        <a href="/booking.html" class="btn btn-primary btn-block mt-3">
                            <i class="fas fa-calendar-check"></i> Book Service
                        </a>
                        <a href="/shop.html" class="btn btn-secondary btn-block mt-2">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                </div>`;
        }

        function changeQty(id, delta) {
            let cart = getCart();
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty = Math.max(1, (item.qty || 1) + delta);
            saveCart(cart); render();
        }

        function removeItem(id) {
            let cart = getCart().filter(i => i.id !== id);
            saveCart(cart); render();
        }

        function clearCart() {
            if (confirm('Remove all items from your cart?')) {
                saveCart([]); render();
            }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>

</html>
