<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — SamMoto</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar">
    <a href="/index.html" class="nav-logo">SAM<span>MOTO</span></a>
    <ul class="nav-links" id="nav-links"></ul>
    <div class="nav-right" id="nav-right"></div>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>
<div class="mobile-menu" id="mobile-menu"><div id="mobile-links"></div></div>

<div style="padding:100px 5% 60px">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:0.5rem">Your <span class="text-accent">Cart</span></h1>
    <p style="color:var(--muted);margin-bottom:2rem">Review items before booking</p>

    <div id="cart-content"></div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
<script>
function getCart() { return JSON.parse(localStorage.getItem('sm_cart') || '[]'); }
function saveCart(cart) { localStorage.setItem('sm_cart', JSON.stringify(cart)); updateCartBadge(); }

function render() {
    const cart = getCart();
    const container = document.getElementById('cart-content');

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="margin-top:3rem">
                <i class="fas fa-shopping-cart"></i>
                <h3>Your cart is empty</h3>
                <p>Add some parts or services from the shop</p>
                <a href="/shop.html" class="btn btn-primary mt-3">Go to Shop</a>
            </div>`;
        return;
    }

    let partsCost = 0, laborCost = 0;
    cart.forEach(i => {
        const p = parseFloat(i.price) * (i.qty || 1);
        if (i.type === 'part') partsCost += p; else laborCost += p;
    });
    const total = partsCost + laborCost;

    container.innerHTML = `
        <div class="cart-layout">
            <div id="cart-items">
                ${cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-icon"><i class="fas ${item.icon || 'fa-box'}"></i></div>
                        <div class="cart-item-info">
                            <div class="name">${item.name}</div>
                            <div class="meta">${item.category} · ₹${parseFloat(item.price).toFixed(2)} each</div>
                        </div>
                        <div class="qty-ctrl">
                            <button class="qty-btn" onclick="changeQty('${item.id}',-1)"><i class="fas fa-minus" style="font-size:0.65rem"></i></button>
                            <span class="qty-num">${item.qty || 1}</span>
                            <button class="qty-btn" onclick="changeQty('${item.id}',1)"><i class="fas fa-plus" style="font-size:0.65rem"></i></button>
                        </div>
                        <div style="font-weight:700;min-width:70px;text-align:right">₹${(parseFloat(item.price)*(item.qty||1)).toFixed(2)}</div>
                        <button onclick="removeItem('${item.id}')" style="background:none;border:none;color:var(--muted);font-size:1rem;padding:4px;transition:color 0.2s" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`).join('')}
                <button onclick="clearCart()" class="btn btn-secondary btn-sm mt-2">
                    <i class="fas fa-trash"></i> Clear Cart
                </button>
            </div>
            <div class="order-summary">
                <h3>Order Summary</h3>
                <div class="summary-row"><span class="label">Parts & Accessories</span><span>₹${partsCost.toFixed(2)}</span></div>
                <div class="summary-row"><span class="label">Labour & Services</span><span>₹${laborCost.toFixed(2)}</span></div>
                <div class="summary-row total"><span>Total</span><span class="text-accent">₹${total.toFixed(2)}</span></div>
                <a href="/booking.html" class="btn btn-primary btn-block mt-3">
                    <i class="fas fa-calendar-check"></i> Book Service
                </a>
                <a href="/shop.html" class="btn btn-secondary btn-block mt-2">
                    <i class="fas fa-arrow-left"></i> Continue Shopping
                </a>
            </div>
        </div>`;
}

function changeQty(id, delta) {
    let cart = getCart();
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty = Math.max(1, (item.qty || 1) + delta);
    saveCart(cart); render();
}

function removeItem(id) {
    let cart = getCart().filter(i => i.id !== id);
    saveCart(cart); render();
}

function clearCart() {
    if (confirm('Remove all items from your cart?')) {
        saveCart([]); render();
    }
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
